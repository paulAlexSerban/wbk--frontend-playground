name: Dashboard Quality And Deploy Front-end Playground
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

env:
    NODE_VERSION: 22.14.0
    BASE_URL: ${{ secrets.BASE_URL }}

jobs:
    dashboard-quality:
        name: Dashboard Quality Checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
                uses: actions/checkout@v4

            - name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                        node-version: ${{ env.NODE_VERSION }}
                        cache: yarn

            - name: Install dependencies
                run: yarn install --frozen-lockfile

            - name: Build dashboard source library
                run: yarn build:lib:dev-days-matrix

            - name: Package libraries for dashboard
                run: yarn package:libraries

            - name: Run dashboard quality gate
                run: yarn check:dashboard

    deploy:
        name: Deploy Front-end Playground
                needs: dashboard-quality
                if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: '📥 checkout repository'
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: '🔄  Cache node_modules'
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: '🔧  Setup NodeJS ${{ env.NODE_VERSION }}'
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ env.NODE_VERSION }}

