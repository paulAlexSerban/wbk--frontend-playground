name: Build n Deploy
on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    NODE_VERSION: 24.15.0
    REPO_NAME: wbk--reactjs-forge

permissions:
    contents: write

jobs:
    build-n-package:
        name: 'Build & Package'
        runs-on: ubuntu-latest
        steps:
            - name: '📥 checkout repository'
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: '🔧  Setup NodeJS ${{ env.NODE_VERSION }}'
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'yarn'

            - name: '🔧 Install dependencies'
              run: yarn install

            - name: 'Run Build'
              run: yarn run build:prod

            - name: Build Dashboard
              run: yarn run build:dashboard

            - name: 'Upload apps artifact'
              uses: actions/upload-artifact@v7
              with:
                  name: package-${{ github.run_number }}-${{ github.run_id }}
                  path: './package/${{ env.REPO_NAME }}/projects'
                  retention-days: 30

    deploy:
        name: 'Deploy to GitHub Pages'
        needs: build-n-package
        runs-on: ubuntu-latest
        steps:
            - name: 'Download apps artifact'
              uses: actions/download-artifact@v8
              with:
                  name: package-${{ github.run_number }}-${{ github.run_id }}
                  path: ./package

            - name: 'Deploy to GitHub Pages'
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./package
