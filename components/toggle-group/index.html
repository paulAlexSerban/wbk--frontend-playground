<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toggle Group</title><link rel="stylesheet" href="toggle-group/styles.css"><script src="toggle-group/scripts.js" defer="defer"></script></head><body class="toggle-group-page"><main class="page-shell"><header class="page-header"><p class="eyebrow">Component</p><h1>Toggle Group</h1><p class="page-copy">Toggle group pattern for segmented controls and stateful options.</p></header><section class="demo-grid"><article class="demo-card"><div><p class="demo-label">Variation 1</p><h2>Auto Toggle</h2><p class="demo-copy">This keeps the original “Good, Cheap, Fast” tradeoff logic from the legacy pattern.</p></div><div data-js-toggle-group><h3 class="toggle-group__heading">How do you want your project to be?</h3><div class="toggle-container"><input type="checkbox" id="good" class="toggle"/> <label for="good" class="label"><div class="ball"></div></label> <span>Good</span></div><div class="toggle-container"><input type="checkbox" id="cheap" class="toggle"/> <label for="cheap" class="label"><div class="ball"></div></label> <span>Cheap</span></div><div class="toggle-container"><input type="checkbox" id="fast" class="toggle"/> <label for="fast" class="label"><div class="ball"></div></label> <span>Fast</span></div></div></article></section></main></body></html>
